name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the unfinished run on the older one pointless, so it is stopped: less waiting, less energy spent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-tests:
    name: Data-pipeline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    env:
      # The site needs the address and key of its data service to start. These are stand-ins (nothing listens here, or the test mocks it).
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-key-not-real
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:size

  phone-layout:
    name: Phone layout (every page at 320 and 375 px)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:phone
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  # Safari's engine on an iPad and an iPhone, with real touch taps. A rule that worked in Chrome once left the toggles on several pages dead in Safari, and nothing run in Chrome could show it.
  safari-touch:
    name: Safari on iPad and iPhone (taps and tap areas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:safari
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: safari-report
          path: frontend/test-results
          retention-days: 7

  # The layout audit opens every page at five sizes and took half an hour in one piece; it is cut into four parts that run side by side.
  layout-audit:
    name: Layout audit, part ${{ matrix.shard }} of 4 (phone, tablet, laptop, desktop and ultrawide)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: layout-report-${{ matrix.shard }}
          path: frontend/test-results
          retention-days: 7

  # The pictures are for a person to look at, so they are made alongside the audit instead of making it wait.
  pictures:
    name: Layout pictures (for looking at)
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-key-not-real
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run shots
      - uses: actions/upload-artifact@v4
        with:
          name: layout-pictures
          path: frontend/screenshots
          retention-days: 7

  speed:
    name: Speed and quality budget (Lighthouse)
    runs-on: ubuntu-latest
    env:
      # The site needs the address and key of its data service to start. These are stand-ins (nothing listens here, or the test mocks it).
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-key-not-real
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # The runner image no longer comes with a Chrome that Lighthouse can find, so the same Chromium the browser tests use is installed and named.
      - run: npx playwright install --with-deps chromium
      - run: echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      # The page asks the data service for a few counts as it loads, so a stand-in answers with empty lists instead of the console filling with failed requests.
      - run: nohup node scripts/mock-data-service.mjs 54321 > mock.log 2>&1 &
      # The limits in lighthouserc.json are for Lighthouse's simulated slow phone (a 4x slower processor on a 1.6 Mbit/s line), where the app's JavaScript takes about 5.3 seconds to show the
      # tax page's tabs and 4.2 seconds to show the home page's introduction (measured 5.2 to 5.4 seconds on this runner, and 5.3 on a Mac). On an ordinary connection the same
      # paint comes at 0.3 to 0.8 seconds. Every page is already sent with its own title, heading and introduction (scripts/prerender.mjs), and the check serves them as Vercel does
      # (scripts/serve-dist.mjs, since `vite preview` answers every address with the home page); the large paint that counts is the app's own content, which arrives once the scripts
      # have run, so pre-rendering cannot bring this number down. The limits sit just above it so a real slowdown still fails.
      - run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json
      # Says which score failed, and by how much, where it can be read without opening the log.
      - name: Report which scores failed
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const f = ".lighthouseci/assertion-results.json";
            if (!fs.existsSync(f)) { console.log("::error::Lighthouse wrote no results"); process.exit(0); }
            for (const r of JSON.parse(fs.readFileSync(f, "utf8"))) console.log(`::error::${r.url.replace(/^https?:\/\/[^/]+/, "") || "/"} ${r.auditId} ${r.operator}${r.expected} but was ${Number(r.actual).toFixed(2)}`);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 7

  routing-offline:
    name: Page addresses, back button and working offline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-report
          path: frontend/test-results
          retention-days: 7

  browser-tests:
    name: Browser tests, part ${{ matrix.shard }} of 2 (accessibility, contrast, polish, Your area, menus, Welsh, games and the rest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:more -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-report-${{ matrix.shard }}
          path: frontend/test-results
          retention-days: 7
