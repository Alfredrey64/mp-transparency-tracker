name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the unfinished run on the older one pointless, so it is stopped: less waiting, less energy spent. Not on main, though: there a run that
# has started is allowed to finish (GitHub keeps only the newest waiting one), so a burst of pushes cannot leave the last several commits without a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  root-tests:
    name: Data-pipeline unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The site needs the address and key of its data service to start. These are stand-ins (nothing listens here, or the test mocks it).
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-key-not-real
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:size
      # Every page's share image is named from its heading and description, so one whose wording changed has no image until it is redrawn (node scripts/build-page-og.mjs).
      - run: node scripts/build-page-og.mjs --check

  phone-layout:
    name: Phone layout (every page at 320 and 375 px)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:phone
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7

  # Safari's engine on an iPad and an iPhone, with real touch taps. A rule that worked in Chrome once left the toggles on several pages dead in Safari, and nothing run in Chrome could show it.
  safari-touch:
    name: Safari on iPad and iPhone (taps and tap areas)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:safari
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: safari-report
          path: frontend/test-results
          retention-days: 7

  # The layout audit opens every page at five sizes and took half an hour in one piece; it is cut into four parts that run side by side.
  layout-audit:
    name: Layout audit, part ${{ matrix.shard }} of 4 (phone, tablet, laptop, desktop and ultrawide)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: layout-report-${{ matrix.shard }}
          path: frontend/test-results
          retention-days: 7

  # The pictures are for a person to look at, so they are made alongside the audit instead of making it wait.
  pictures:
    name: Layout pictures (for looking at)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-key-not-real
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run shots
      - uses: actions/upload-artifact@v7
        with:
          name: layout-pictures
          path: frontend/screenshots
          retention-days: 7

  speed:
    name: Speed and quality budget (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The site needs the address and key of its data service to start. These are stand-ins (nothing listens here, or the test mocks it).
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-key-not-real
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # The runner image no longer comes with a Chrome that Lighthouse can find, so the same Chromium the browser tests use is installed and named.
      - run: npx playwright install --with-deps chromium
      - run: echo "CHROME_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"
      # The page asks the data service for a few counts as it loads, so a stand-in answers with empty lists instead of the console filling with failed requests.
      - run: nohup node scripts/mock-data-service.mjs 54321 > mock.log 2>&1 &
      # The limits in lighthouserc.json are for Lighthouse's simulated slow phone (a 4x slower processor on a 1.6 Mbit/s line), where the app's JavaScript takes about 5.3 seconds to show the
      # tax page's tabs and 4.2 seconds to show the home page's introduction (measured 5.2 to 5.4 seconds on this runner, and 5.3 on a Mac). On an ordinary connection the same
      # paint comes at 0.3 to 0.8 seconds. Every page is already sent with its own title, heading and introduction (scripts/prerender.mjs), and the check serves them as Vercel does
      # (scripts/serve-dist.mjs, since `vite preview` answers every address with the home page); the large paint that counts is the app's own content, which arrives once the scripts
      # have run, so pre-rendering cannot bring this number down. The limits sit just above it so a real slowdown still fails.
      # Measured on a Mac, /taxRates scores 0.79 with 10 ms of blocking time, run after run. On the shared runners the same page has now and then come out at 680 to 840 ms and 0.62 to
      # 0.64, and the next run an hour later passed with no change to the page: a runner being slow, not the page. Each page is measured five times (the middle result counts) and the
      # whole check is run a second time if it fails, so a real slowdown, which fails both times, still stops the build, and a slow runner does not.
      - name: Lighthouse (a second try if the first misses)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json || { echo "::warning::Lighthouse missed its limits once; measuring again"; rm -rf .lighthouseci; npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json; }
      # Says which score failed, and by how much, where it can be read without opening the log.
      - name: Report which scores failed
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const f = ".lighthouseci/assertion-results.json";
            if (!fs.existsSync(f)) { console.log("::error::Lighthouse wrote no results"); process.exit(0); }
            for (const r of JSON.parse(fs.readFileSync(f, "utf8"))) console.log(`::error::${r.url.replace(/^https?:\/\/[^/]+/, "") || "/"} ${r.auditId} ${r.operator}${r.expected} but was ${Number(r.actual).toFixed(2)}`);
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          include-hidden-files: true # the folder's name starts with a dot, which the upload skips otherwise
          retention-days: 7

  # A page that freezes for a second or jumps while it loads feels broken on a phone. This opens the pages that hold the most boxes or load the most, on an emulated phone with a
  # processor four times slower, scrolls each, and fails if a freeze or a jump is over the limit. Before the box-balancing fix the MPs list froze for 2.4 seconds and several other
  # pages for over a second on a laptop; they now take under 0.2. The limits are loose (a task over 700 ms, a layout shift over 0.25) because the runner is slower than a laptop.
  smoothness:
    name: Smoothness (freezes and jumps on the busiest pages)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-key-not-real
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: nohup node scripts/mock-data-service.mjs 54321 > mock.log 2>&1 &
      - run: nohup npx vite preview --port 4178 --strictPort > preview.log 2>&1 &
      - run: npx --yes wait-on@8 http://localhost:4178 --timeout 60000
      - run: node e2e/smoothness.audit.mjs
        env:
          ONLY: home,list,tracker,donors,constituency,budget,formerMps,byElections,offices,taxRates,lords,ageing,care
          WORKERS: "1"
          SETTLE: "1"
          TASK: "700"
          CLS: "0.25"
      # Moving from page to page inside the site, which is what a visitor does: fails on a blank screen between two pages, a page that jumps, or a scroll that moves by itself. The
      # pages named are the ones that have each broken it before (the sector pages' first visit, Standards, Rebels, the pages that fetch before they show).
      - run: node e2e/navigation.audit.mjs
        env:
          ONLY: prices,publicFinances,standards,rebels,list,tracker,budget,lords,ageing,care,statutoryInstruments,offices,marginals,compareSeats,indicators
          PHONE: "1"
          CLS: "0.25"
          BLANK: "6"
      # Diagrams that show their finished state and then snap back to the start to play look like a flash. Opens the pages with the most animated diagrams and watches every frame.
      - run: node e2e/flash.audit.mjs
        env:
          ONLY: home,statutoryInstruments,thinkTanks,devolved,budget,ageing,care
          WORKERS: "1"
      # Every page opened with "reduce motion" on: fails on anything still travelling, spinning or looping (a short fade is allowed), and on a diagram that is neither named nor hidden
      # from screen readers. Icons are decorative, so the shared icon sets mark themselves aria-hidden; a new diagram needs a role="img" and an aria-label, or aria-hidden.
      - run: node e2e/motion-a11y.audit.mjs
        env:
          WORKERS: "2"
      # Every page at 320, 390, 768 and 1280 px: fails on text cut off by the box around it (a headline figure losing its last letters) and on a chart axis that repeats a label
      # ("£25bn" twice), which makes the scale look wrong.
      - run: node e2e/numbers-fit.audit.mjs
        env:
          WORKERS: "2"
      # Presses up to six controls on every page (tabs, filters, toggles) and watches every frame for a second: fails when the pressed control jumps across the screen, the page
      # becomes too short for where the visitor stood, or the heading goes missing. Scrolls that glide, and the browser holding the control still, are fine.
      - run: node e2e/interaction.audit.mjs
        env:
          PER: "6"
          WORKERS: "2"

  routing-offline:
    name: Page addresses, back button and working offline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:site
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: site-report
          path: frontend/test-results
          retention-days: 7

  browser-tests:
    name: Browser tests, part ${{ matrix.shard }} of 2 (accessibility, contrast, polish, Your area, menus, Welsh, games and the rest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:more -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-report-${{ matrix.shard }}
          path: frontend/test-results
          retention-days: 7
