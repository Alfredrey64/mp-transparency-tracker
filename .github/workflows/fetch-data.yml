name: Fetch MP Financial Interests, Voting Records, Bills, Donor Sectors, News, Former MPs, On This Day, Today's Business, Party Finances, By-Elections, House of Lords Peers, MP Activity, IPSA Expenses, Petitions, Ministerial Gifts, Select Committees, Written Questions, and Standards Reports

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # continue-on-error is set on every fetch step below deliberately: each
      # one writes to its own, independent Supabase table, so one script
      # having a bad day (a flaky upstream API, a transient network error)
      # shouldn't stop every step after it from running too — that's what
      # used to happen here, and was why the donor-sector commit at the very
      # end (the step that actually deploys anything) kept getting skipped
      # whenever an earlier, unrelated step failed.

      - name: Run the financial interests fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-interests.js

      - name: Run the voting records fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-votes.js

      - name: Run the bills fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-bills.js

      # Google News RSS is a public feed with no API key, but it's a slow
      # per-MP crawl (~650 requests, politely rate-limited) — expect this
      # step alone to take several minutes.
      - name: Run the MP news fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-mp-news.js

      - name: Run the donor sector tagging script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: node fetch-donor-sectors.js

      - name: Run the party donations fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-party-donations.js

      - name: Run the party donor sector tagging script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: node fetch-party-donor-sectors.js

      - name: Run the former MPs fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-former-mps.js

      # Checks every current MP's latest election result, so this is another
      # ~650-request crawl like the MP news step above — expect it to take a
      # few minutes too.
      - name: Run the by-elections fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-by-elections.js

      - name: Run the on-this-day fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-on-this-day.js

      - name: Run today's Commons business fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-todays-business.js

      # ~815 peers, each needing four follow-up requests (biography,
      # government role, recent debate contributions, recent written
      # questions) — expect this step to take several minutes.
      - name: Run the House of Lords peers fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-peers.js

      # ~650 MPs, two requests each (debate contributions, written
      # questions) — the Commons equivalent of the Lords activity above.
      - name: Run the MP activity fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-mp-activity.js

      # Relies on IPSA's own site internals (a Next.js build id, rediscovered
      # each run) rather than a documented API — see the script's own header
      # comment for why, and the caveat that comes with that.
      - name: Run the IPSA business cost claims fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-ipsa-expenses.js

      - name: Run the petitions fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-petitions.js

      - name: Run the ministerial gifts & hospitality fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-ministerial-gifts.js

      # ~45 committees, three requests each (details, current members,
      # open inquiries) — see the script's own header comment for exactly
      # which committee types count as "select committees" here.
      - name: Run the select committees fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-committees.js

      # A 30-day rolling window, but that's still several thousand written
      # questions most days — expect this step to take a few minutes.
      - name: Run the written questions fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-written-questions.js

      - name: Run the standards reports fetch script
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-standards-reports.js

      # The scripts above write straight to Supabase, so the live site picks
      # them up on its next request — no deploy needed. The donor sector
      # tagger is different: it writes a file *in the repo*
      # (frontend/src/data/donorSectors.json), so that file has to be
      # committed and pushed here for the change to exist anywhere, and
      # pushing it is what triggers Vercel to rebuild the site with it. This
      # step has no continue-on-error — if it fails, we want the run to show
      # red rather than silently not deploying anything.
      - name: Commit updated donor sector data, if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/donorSectors.json frontend/src/data/donorSectorsMeta.json frontend/src/data/partyDonorSectors.json frontend/src/data/partyDonorSectorsMeta.json
          git diff --staged --quiet || git commit -m "chore: daily donor sector data refresh"
          git push
