name: Fetch MP financial interests, voting records, bills, news, donors, Lords, petitions, constituencies, councils, statistics and office-holders

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# One refresh at a time: a second run started while the first is still crawling would write the same tables and push the same files.
concurrency:
  group: fetch-data
  cancel-in-progress: false

# The refresh is split into jobs that run side by side. Run one after another, its steps took more than six hours (the Lords step alone over two),
# which is GitHub's limit for a job, so from 26 October every run was cancelled before it reached the later steps and nothing after the first
# dozen was refreshed. Each job below keeps its own steps, saves the data files it wrote, and the last job gathers them, builds the benchmarks
# that need every table, reports what happened and commits once.
#
# continue-on-error is set on every fetch step deliberately: each one writes to its own, independent table or file, so one script having a bad day
# (a flaky upstream API, a transient network error) shouldn't stop the others, and the final job still publishes whatever succeeded.
jobs:

  records:
    name: "The MP and money records (database tables)"
    runs-on: ubuntu-latest
    # A crawl that hangs should end the job, not use the six-hour default.
    timeout-minutes: 300
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      - name: Run the financial interests fetch script
        id: fetch_interests
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-interests.js

      - name: Run the voting records fetch script
        id: fetch_votes
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-votes.js

      - name: Run the bills fetch script
        id: fetch_bills
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-bills.js

      # Google News RSS is a public feed with no API key, but it's a slow
      # per-MP crawl (~650 requests, politely rate-limited) — expect this
      # step alone to take several minutes.
      - name: Run the MP news fetch script
        id: fetch_mp_news
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-mp-news.js

      - name: Run the donor sector tagging script
        id: fetch_donor_sectors
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: node fetch-donor-sectors.js

      - name: Run the party donations fetch script
        id: fetch_party_donations
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-party-donations.js

      - name: Run the party donor sector tagging script
        id: fetch_party_donor_sectors
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: node fetch-party-donor-sectors.js

      - name: Run the former MPs fetch script
        id: fetch_former_mps
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-former-mps.js

      # Checks every current MP's latest election result, so this is another
      # ~650-request crawl like the MP news step above — expect it to take a
      # few minutes too.
      - name: Run the by-elections fetch script
        id: fetch_by_elections
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-by-elections.js

      - name: Run the on-this-day fetch script
        id: fetch_on_this_day
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-on-this-day.js

      - name: Run today's Commons business fetch script
        id: fetch_todays_business
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-todays-business.js

      - name: Note how each step went
        if: always()
        run: |
          echo "STATUS_fetch_interests=${{ steps.fetch_interests.outcome }}" >> status.env
          echo "STATUS_fetch_votes=${{ steps.fetch_votes.outcome }}" >> status.env
          echo "STATUS_fetch_bills=${{ steps.fetch_bills.outcome }}" >> status.env
          echo "STATUS_fetch_mp_news=${{ steps.fetch_mp_news.outcome }}" >> status.env
          echo "STATUS_fetch_donor_sectors=${{ steps.fetch_donor_sectors.outcome }}" >> status.env
          echo "STATUS_fetch_party_donations=${{ steps.fetch_party_donations.outcome }}" >> status.env
          echo "STATUS_fetch_party_donor_sectors=${{ steps.fetch_party_donor_sectors.outcome }}" >> status.env
          echo "STATUS_fetch_former_mps=${{ steps.fetch_former_mps.outcome }}" >> status.env
          echo "STATUS_fetch_by_elections=${{ steps.fetch_by_elections.outcome }}" >> status.env
          echo "STATUS_fetch_on_this_day=${{ steps.fetch_on_this_day.outcome }}" >> status.env
          echo "STATUS_fetch_todays_business=${{ steps.fetch_todays_business.outcome }}" >> status.env

      - name: Save the outcomes and the files this job wrote
        if: always()
        run: |
          existing=""
          for p in frontend/src/data/donorSectors.json frontend/src/data/donorSectorsMeta.json frontend/src/data/partyDonorSectors.json frontend/src/data/partyDonorSectorsMeta.json; do [ -e "$p" ] && existing="$existing $p"; done
          tar -cf data.tar status.env $existing

      - name: Upload them for the last job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-records
          path: data.tar
          retention-days: 2

  lords:
    name: "The House of Lords, who sits there, their careers and how they vote"
    runs-on: ubuntu-latest
    # A crawl that hangs should end the job, not use the six-hour default.
    timeout-minutes: 300
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      # ~815 peers, each needing four follow-up requests (biography,
      # government role, recent debate contributions, recent written
      # questions) — expect this step to take several minutes.
      - name: Run the House of Lords peers fetch script
        id: fetch_peers
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-peers.js

      # The same for every current peer, for the Lords tab of Parliament in
      # Numbers (~800 requests).
      - name: Run the Lords careers fetch script
        id: fetch_lords_careers
        continue-on-error: true
        run: node fetch-lords-careers.js

      # How every peer voted in the last 12 months, from Parliament's Lords
      # Votes API, for the How peers vote page (~250 requests).
      - name: Run the Lords votes fetch script
        id: fetch_lords_votes
        continue-on-error: true
        run: node fetch-lords-votes.js

      - name: Note how each step went
        if: always()
        run: |
          echo "STATUS_fetch_peers=${{ steps.fetch_peers.outcome }}" >> status.env
          echo "STATUS_fetch_lords_careers=${{ steps.fetch_lords_careers.outcome }}" >> status.env
          echo "STATUS_fetch_lords_votes=${{ steps.fetch_lords_votes.outcome }}" >> status.env

      - name: Save the outcomes and the files this job wrote
        if: always()
        run: |
          existing=""
          for p in frontend/src/data/lordsCareers.json frontend/src/data/lordsCareerDetail frontend/src/data/lordsVotes.json; do [ -e "$p" ] && existing="$existing $p"; done
          tar -cf data.tar status.env $existing

      - name: Upload them for the last job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-lords
          path: data.tar
          retention-days: 2

  activity:
    name: "What MPs have been doing: activity, claims, petitions, committees and questions"
    runs-on: ubuntu-latest
    # A crawl that hangs should end the job, not use the six-hour default.
    timeout-minutes: 300
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      # ~650 MPs, two requests each (debate contributions, written
      # questions) — the Commons equivalent of the Lords activity above.
      - name: Run the MP activity fetch script
        id: fetch_mp_activity
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-mp-activity.js

      # Relies on IPSA's own site internals (a Next.js build id, rediscovered
      # each run) rather than a documented API — see the script's own header
      # comment for why, and the caveat that comes with that.
      - name: Run the IPSA business cost claims fetch script
        id: fetch_ipsa_expenses
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-ipsa-expenses.js

      - name: Run the petitions fetch script
        id: fetch_petitions
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-petitions.js

      - name: Run the ministerial gifts & hospitality fetch script
        id: fetch_ministerial_gifts
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-ministerial-gifts.js

      # ~45 committees, three requests each (details, current members,
      # open inquiries) — see the script's own header comment for exactly
      # which committee types count as "select committees" here.
      - name: Run the select committees fetch script
        id: fetch_committees
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-committees.js

      # A 30-day rolling window, but that's still several thousand written
      # questions most days — expect this step to take a few minutes.
      - name: Run the written questions fetch script
        id: fetch_written_questions
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-written-questions.js

      - name: Run the standards reports fetch script
        id: fetch_standards_reports
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-standards-reports.js

      - name: Note how each step went
        if: always()
        run: |
          echo "STATUS_fetch_mp_activity=${{ steps.fetch_mp_activity.outcome }}" >> status.env
          echo "STATUS_fetch_ipsa_expenses=${{ steps.fetch_ipsa_expenses.outcome }}" >> status.env
          echo "STATUS_fetch_petitions=${{ steps.fetch_petitions.outcome }}" >> status.env
          echo "STATUS_fetch_ministerial_gifts=${{ steps.fetch_ministerial_gifts.outcome }}" >> status.env
          echo "STATUS_fetch_committees=${{ steps.fetch_committees.outcome }}" >> status.env
          echo "STATUS_fetch_written_questions=${{ steps.fetch_written_questions.outcome }}" >> status.env
          echo "STATUS_fetch_standards_reports=${{ steps.fetch_standards_reports.outcome }}" >> status.env

      - name: Save the outcomes and the files this job wrote
        if: always()
        run: |
          existing=""
          for p in ; do [ -e "$p" ] && existing="$existing $p"; done
          tar -cf data.tar status.env $existing

      - name: Upload them for the last job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-activity
          path: data.tar
          retention-days: 2

  static:
    name: "Results, councils, statistics and office-holders saved as files with the site"
    runs-on: ubuntu-latest
    # A crawl that hangs should end the job, not use the six-hour default.
    timeout-minutes: 300
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci


      # No Supabase credentials needed: this one writes a JSON file into the
      # repo (frontend/src/data/constituencies.json) rather than a table,
      # committed by the last step below. ~650 requests for election results
      # plus ~75 petition lookups — expect a few minutes.
      - name: Run the constituencies fetch script
        id: fetch_constituencies
        continue-on-error: true
        run: node fetch-constituencies.js

      # Former MPs grouped by the last seat they held, for the Constituency
      # page's History tab (~90 requests). Reads constituencies.json, so it
      # has to run after the step above.
      - name: Run the constituency history fetch script
        id: fetch_constituency_history
        continue-on-error: true
        run: node fetch-constituency-history.js

      # Each current MP's career facts (first elected, terms served, posts
      # held, party changes) from their Members API biography, for the
      # Parliament in Numbers page and the Career tab on each profile
      # (~650 requests).
      - name: Run the MP careers fetch script
        id: fetch_mp_careers
        continue-on-error: true
        run: node fetch-mp-careers.js

      # Every UK councillor, council make-up and election dates, from Open
      # Council Data UK (CC BY-SA 4.0), for the Your Council page.
      - name: Run the councils fetch script
        id: fetch_councils
        continue-on-error: true
        run: node fetch-councils.js

      # One searchable file of every councillor, built from the council
      # files the step above just wrote, for the Councillors page. Has to
      # run after the councils fetch.
      - name: Build the councillor list
        id: build_councillors
        continue-on-error: true
        run: node frontend/scripts/build-councillors.mjs

      # The list of pledges and verdicts on Full Fact's Government Tracker,
      # for the full pledge list on the Promises tracker page.
      - name: Run the Full Fact tracker fetch script
        id: fetch_fullfact_tracker
        continue-on-error: true
        run: node frontend/scripts/fetch-fullfact-tracker.mjs

      # Official statistics from the Office for National Statistics (Open
      # Government Licence v3.0) for the Britain in numbers pages.
      - name: Run the ONS statistics fetch script
        id: fetch_ons
        continue-on-error: true
        run: node fetch-ons.js

      # Regional breakdowns for the "by place" maps on the Jobs, Housing and
      # Crime pages (Annual Population Survey, pay, house prices, police
      # recorded crime by region). Runs after fetch-ons.js.
      - name: Run the regional breakdowns fetch script
        id: fetch_regional_breakdowns
        continue-on-error: true
        run: node fetch-regional-breakdowns.js

      # Who holds the other elected offices a postcode is covered by (police
      # commissioners, regional mayors, Senedd members, MSPs and MLAs), for the
      # Your area page. Stops without writing if a source has changed shape.
      - name: Fetch the other elected representatives
        id: fetch_representatives
        continue-on-error: true
        run: node fetch-representatives.js

      - name: Note how each step went
        if: always()
        run: |
          echo "STATUS_fetch_constituencies=${{ steps.fetch_constituencies.outcome }}" >> status.env
          echo "STATUS_fetch_constituency_history=${{ steps.fetch_constituency_history.outcome }}" >> status.env
          echo "STATUS_fetch_mp_careers=${{ steps.fetch_mp_careers.outcome }}" >> status.env
          echo "STATUS_fetch_councils=${{ steps.fetch_councils.outcome }}" >> status.env
          echo "STATUS_build_councillors=${{ steps.build_councillors.outcome }}" >> status.env
          echo "STATUS_fetch_fullfact_tracker=${{ steps.fetch_fullfact_tracker.outcome }}" >> status.env
          echo "STATUS_fetch_ons=${{ steps.fetch_ons.outcome }}" >> status.env
          echo "STATUS_fetch_regional_breakdowns=${{ steps.fetch_regional_breakdowns.outcome }}" >> status.env
          echo "STATUS_fetch_representatives=${{ steps.fetch_representatives.outcome }}" >> status.env

      - name: Save the outcomes and the files this job wrote
        if: always()
        run: |
          existing=""
          for p in frontend/src/data/constituencies.json frontend/src/data/constituencySummary.json frontend/src/data/constituencyHistory.json frontend/src/data/mpCareers.json frontend/src/data/careerDetail frontend/src/data/councilsIndex.json frontend/src/data/councilDetail frontend/src/data/ons frontend/src/data/regionalBreakdowns.json frontend/src/data/fullFactPledges.json frontend/src/data/representatives.json frontend/public/data/councillors.json; do [ -e "$p" ] && existing="$existing $p"; done
          tar -cf data.tar status.env $existing

      - name: Upload them for the last job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-static
          path: data.tar
          retention-days: 2

  publish:
    name: "Build the benchmarks, report what happened and commit"
    needs: [records, lords, activity, static]
    # Publishes whatever the other jobs produced, even if one of them failed or ran out of time.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect what the other jobs saved
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results

      - name: Put their files in place and read their outcomes
        run: |
          shopt -s nullglob
          for t in results/*/data.tar; do
            d=$(mktemp -d)
            tar -xf "$t" -C "$d"
            [ -f "$d/status.env" ] && cat "$d/status.env" >> "$GITHUB_ENV"
            rm -f "$d/status.env"
            cp -R "$d"/. .
          done


      # How each MP compares with the rest (declared value, outside earnings,
      # expenses, rebellion rate, attendance, years served), for the "what
      # this means" lines on the site. Reads the tables the steps above fill
      # and mpCareers.json, so it has to run after them.
      - name: Build the MP benchmarks
        id: build_benchmarks
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node build-benchmarks.js

      # continue-on-error above means the workflow run itself can show green
      # even when several scripts above silently failed — nothing surfaced
      # that anywhere except by opening this run and reading every step by
      # hand. `if: always()` so this runs whether earlier steps failed or
      # not, turning each one's outcome into a small JSON file the live
      # site reads directly (see report-pipeline-status.js and the "How
      # often it updates" section it feeds on the Data & Methodology page).
      - name: Report pipeline run status
        if: always()
        env:
          STATUS_build_benchmarks: ${{ steps.build_benchmarks.outcome }}
        run: node report-pipeline-status.js

      # The scripts above write straight to Supabase, so the live site picks
      # them up on its next request — no deploy needed. The donor sector
      # tagger and the pipeline status report are different: they write a
      # file *in the repo* (frontend/src/data/*.json), so those files have
      # to be committed and pushed here for the change to exist anywhere,
      # and pushing them is what triggers Vercel to rebuild the site with
      # them. This step has no continue-on-error — if it fails, we want the
      # run to show red rather than silently not deploying anything.
      # `if: always()` so the status report above still gets committed and
      # deployed even on a run where an earlier fetch step failed — that's
      # exactly the run a visitor most needs to see an honest status for.
      - name: Commit updated data files, if they changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/src/data/constituencies.json frontend/src/data/constituencySummary.json frontend/src/data/constituencyHistory.json frontend/src/data/mpCareers.json frontend/src/data/careerDetail frontend/src/data/lordsCareers.json frontend/src/data/benchmarks.json frontend/src/data/representatives.json frontend/src/data/councilsIndex.json frontend/src/data/councilDetail frontend/src/data/ons frontend/src/data/regionalBreakdowns.json frontend/src/data/lordsCareerDetail frontend/src/data/donorSectors.json frontend/src/data/donorSectorsMeta.json frontend/src/data/partyDonorSectors.json frontend/src/data/partyDonorSectorsMeta.json frontend/src/data/pipelineStatus.json frontend/src/data/lordsVotes.json frontend/src/data/fullFactPledges.json frontend/public/data/councillors.json
          git diff --staged --quiet || git commit -m "chore: daily data refresh"
          # Someone may have pushed while the crawl ran: sit this commit on top of theirs rather than being refused.
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push
