name: Tax data check

# Reads HMRC's and GOV.UK's published tax tables every day and fails if a rate on the Tax rates through time page no longer matches.
# It changes nothing: a failure means a Budget, an uprating or a correction needs adding to frontend/src/data/taxSeries.json.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Turns the last error of any failing script into an annotation on the run (see ci-notes.js).
  NODE_OPTIONS: --import ${{ github.workspace }}/ci-notes.js

jobs:
  check:
    name: Tax rates match the official tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node frontend/scripts/check-tax-data.mjs
