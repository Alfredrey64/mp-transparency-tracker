name: Tax data check

# Reads HMRC's and GOV.UK's published tax tables every day and fails if a rate on the Tax rates through time page no longer matches.
# It changes nothing: a failure means a Budget, an uprating or a correction needs adding to frontend/src/data/taxSeries.json.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tax rates match the official tables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Report failing scripts as annotations
        # Set after checkout, not at the top of the file: the checkout action runs on Node too and would fail loading a file that is not there yet.
        run: echo "NODE_OPTIONS=--import $GITHUB_WORKSPACE/ci-notes.js" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node frontend/scripts/check-tax-data.mjs
