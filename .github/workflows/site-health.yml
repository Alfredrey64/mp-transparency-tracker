name: Site health

# Opens the live site every few hours the way a visitor would (see frontend/scripts/check-site.mjs). If something is broken it opens an issue, and
# GitHub emails the repository's owner. When the site is well again it closes the issue. It changes nothing on the site.

on:
  schedule:
    - cron: "11 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Site is up and working
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the live site
        id: check
        # Written to a file and not piped to tee: a pipe hands GitHub tee's exit code (always 0), so a failed check would be recorded as a pass.
        run: |
          node scripts/check-site.mjs > ../site-check.txt && status=0 || status=$?
          cat ../site-check.txt
          exit $status
      - name: Open an issue if it failed
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --state open --label site-health --json number --jq '.[0].number')" ]; then
            gh label create site-health --color B60205 --description "The live site failed its health check" 2>/dev/null || true
            gh issue create --label site-health --title "The live site failed its health check" --body "$(printf 'The scheduled check found a problem. Details:\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s' "$(grep -E '^(FAIL|[0-9]+ problem)' ../site-check.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          fi
      - name: Close the issue when the site is well again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --label site-health --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The health check passed again, so this is closed."
          done

  fresh:
    name: The data has been refreshed lately
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - name: Find the last daily data refresh
        id: age
        run: |
          last=$(git log -1 --format=%ct --grep="^chore: daily data refresh")
          now=$(date +%s)
          if [ -z "$last" ]; then hours=9999; else hours=$(( (now - last) / 3600 )); fi
          echo "hours=$hours" >> "$GITHUB_OUTPUT"
          echo "The last daily data refresh was $hours hours ago."
      - name: Open an issue if the refresh has stopped
        if: steps.age.outputs.hours > 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --state open --label data-stale --json number --jq '.[0].number')" ]; then
            gh label create data-stale --color D93F0B --description "The daily data refresh has stopped" 2>/dev/null || true
            gh issue create --label data-stale --title "The daily data refresh has stopped" --body "The last daily data refresh was ${{ steps.age.outputs.hours }} hours ago, so the site is showing old figures. Open the 'Fetch MP financial interests...' workflow in the Actions tab to see which job failed or timed out. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/fetch-data.yml"
          fi
      - name: Close the issue when the data is fresh again
        if: steps.age.outputs.hours <= 30
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --label data-stale --json number --jq '.[].number'); do
            gh issue close "$n" --comment "The data has been refreshed again, so this is closed."
          done
      # The daily refresh is green whatever happens to its steps (see fetch-data.yml), so a source that fails every day looks fine from the outside. One failure is usually a
      # bad hour at the source; the same source failing on two refreshes in a row needs a person.
      - name: Find sources that failed on the last two daily refreshes
        id: failing
        run: |
          node failingSources.js > failing.txt
          cat failing.txt
          echo "count=$(grep -c . failing.txt || true)" >> "$GITHUB_OUTPUT"
      - name: Open or update an issue if there are any
        if: steps.failing.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "These data sources failed on the last two daily refreshes, so their pages are showing older figures:"; echo; sed 's/^/- /' failing.txt; echo; echo "The run's summary lists every source: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/fetch-data.yml"; } > issue-body.md
          gh label create source-failing --color D93F0B --description "A data source has failed on two daily refreshes in a row" 2>/dev/null || true
          n=$(gh issue list --state open --label source-failing --json number --jq '.[0].number')
          if [ -z "$n" ]; then gh issue create --label source-failing --title "Data sources are failing" --body-file issue-body.md; else gh issue comment "$n" --body-file issue-body.md; fi
      - name: Close the issue when none are failing
        if: steps.failing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --state open --label source-failing --json number --jq '.[].number'); do
            gh issue close "$n" --comment "No source failed on the last two refreshes, so this is closed."
          done
