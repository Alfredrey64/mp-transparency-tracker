<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Domesday Live</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light dark; --bg: #f4f6fb; --ink: #14213d; --soft: #4a5873; --brand: #1d4ed8; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1626; --ink: #eef2fb; --soft: #a9b6cf; --brand: #7aa2ff; --card: #16213a; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 16px/1.6 "Public Sans", system-ui, sans-serif; }
    main { max-width: 520px; padding: 32px 28px; border-radius: 20px; background: var(--card); box-shadow: 0 1px 3px rgba(10, 20, 36, 0.12), 0 8px 24px rgba(10, 20, 36, 0.08); }
    h1 { margin: 0 0 8px; font: 700 30px/1.2 Newsreader, Georgia, serif; }
    p { margin: 0 0 20px; color: var(--soft); }
    a { display: inline-block; margin: 0 10px 8px 0; padding: 12px 20px; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 700; text-decoration: none; }
    a.alt { background: none; color: var(--brand); box-shadow: inset 0 0 0 2px var(--brand); }
    a:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
    @media (prefers-color-scheme: dark) { a { color: #0e1626; } }
  </style>
</head>
<body>
  <main>
    <h1>We could not find that page</h1>
    <p>The address may have a typing mistake, or the page may have moved. You can start again from the home page or look through the list of pages.</p>
    <a href="/">Go to the home page</a><a class="alt" href="/answers">Ask a question</a>
  </main>
</body>
</html>
