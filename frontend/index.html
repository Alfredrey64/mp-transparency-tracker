<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/early.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=13" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=13" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=13" />
    <link rel="manifest" href="/manifest.json?v=13" />
    <meta name="theme-color" content="#1E4FB8" />
    <!-- The fonts come from this site (see src/fonts.css). The two used above the fold are fetched straight away, in parallel with the
         scripts, and the connection to the data service is opened now rather than when the first query asks for it. -->
    <link rel="preload" href="/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-latin-2.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-figures.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://xwrxaarxhlddbhbdbjmm.supabase.co" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- What is on screen while the app's code is still arriving (and, if it never does, the way out: see public/early.js). It needs no script and no stylesheet of its own,
         so a slow or dropped connection shows a message and a button, not an empty page. React replaces it the moment the app draws. -->
    <style>
      html{background:#ECEFF6}
      html[data-theme="dark"]{background:#0A1220}
      .dl-boot{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;text-align:center;background:#ECEFF6;color:#0A1424;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
      html[data-theme="dark"] .dl-boot{background:#0A1220;color:#F2F5FB}
      .dl-boot-name{margin:0;font:600 28px/1.1 "Newsreader",Georgia,serif;letter-spacing:-0.01em}
      .dl-boot-bar{width:min(220px,60vw);height:3px;border-radius:3px;background:rgba(30,79,184,0.18);overflow:hidden}
      .dl-boot-bar::after{content:"";display:block;height:100%;width:40%;border-radius:3px;background:#1E4FB8;animation:dl-boot-slide 1.3s ease-in-out infinite}
      html[data-theme="dark"] .dl-boot-bar::after{background:#8DB0FF}
      @keyframes dl-boot-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      .dl-boot-msg{margin:0;max-width:34ch;font-size:15px;line-height:1.5;opacity:0.82}
      .dl-boot-help{display:flex;flex-direction:column;align-items:center;gap:12px}
      .dl-boot-help[hidden]{display:none}
      .dl-boot-btn{font-family:inherit;font-weight:600;font-size:15px;line-height:1;cursor:pointer;padding:13px 22px;min-height:44px;border:0;border-radius:999px;background:#1E4FB8;color:#fff}
      @media (prefers-reduced-motion:reduce){.dl-boot-bar::after{animation:none;width:100%}}
    </style>
    <title>Domesday Live</title>
    <meta name="description" content="A simple breakdown of UK politics. See who your MP is, who funds them, how they vote and what the numbers say about the country, all explained in plain English from official sources." />
    <link rel="canonical" href="https://domesdaylive.co.uk/" />

    <!-- iOS-specific "Add to Home Screen" behaviour: launches full-screen with
         no Safari chrome, using the same brand icon and dark status bar. The status bar is opaque (not "translucent"), so the app starts below it
         and the top bar does not have to add its own space for it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Domesday Live" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Domesday Live" />
    <meta property="og:title" content="Domesday Live" />
    <meta property="og:description" content="A simple breakdown of UK politics. See who your MP is, who funds them, how they vote and what the numbers say about the country, all explained in plain English from official sources." />
    <meta property="og:url" content="https://domesdaylive.co.uk/" />
    <meta property="og:image" content="https://domesdaylive.co.uk/og-image.png?v=16" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Domesday Live" />
    <meta name="twitter:description" content="A simple breakdown of UK politics. See who your MP is, who funds them, how they vote and what the numbers say about the country, all explained in plain English from official sources." />
    <meta name="twitter:image" content="https://domesdaylive.co.uk/og-image.png?v=16" />
  </head>
  <body>
    <div id="root">
      <div class="dl-boot" role="status" aria-live="polite">
        <p class="dl-boot-name">Domesday Live</p>
        <div class="dl-boot-bar" aria-hidden="true"></div>
        <p class="dl-boot-msg" id="dl-boot-msg">Loading&hellip;</p>
        <div class="dl-boot-help" id="dl-boot-help" hidden>
          <button type="button" class="dl-boot-btn" id="dl-boot-retry">Try again</button>
        </div>
      </div>
    </div>
    <noscript><p style="position:fixed;inset:auto 0 0 0;margin:0;padding:14px 18px;background:#fff;color:#0A1424;font:15px/1.5 system-ui,sans-serif;text-align:center;z-index:2">Domesday Live needs JavaScript to show its pages. Please turn it on and reload.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
